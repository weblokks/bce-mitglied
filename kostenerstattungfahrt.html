<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCE - Fahrtkosten-Erstattung</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #111; min-height: 100vh; padding: 1.5rem 1rem 3rem; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.10); padding: 2rem 2rem 1.5rem; }
    h1 { font-size: 1.18rem; font-weight: 800; text-align: center; margin-bottom: .25rem; line-height: 1.35; }
    .subtitle { font-size: .82rem; color: #666; text-align: center; margin-bottom: .8rem; }
    .divider { border: none; border-top: 2px solid #111; margin-bottom: 1.4rem; }
    fieldset { border: 1px solid #e0e0e0; border-radius: 7px; padding: 1rem 1rem .5rem; margin-bottom: 1.2rem; }
    legend { font-weight: 700; font-size: .88rem; padding: 0 .4rem; color: #333; text-transform: uppercase; letter-spacing: .04em; }
    .fg { margin-bottom: .85rem; }
    .row { display: flex; gap: .7rem; }
    .row .fg { flex: 1; }
    label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: .3rem; color: #333; }
    .req { color: #c00; }
    input[type="text"], input[type="email"], input[type="number"], input[type="date"], textarea {
      border: 1.5px solid #ccc; border-radius: 5px; padding: 0 .7rem;
      font-size: .92rem; font-family: Arial, sans-serif; background: #fafafa;
      width: 100%; color: #111; transition: border-color .15s; display: block;
    }
    input[type="text"], input[type="email"], input[type="number"], input[type="date"] { height: 2.5rem; }
    textarea { padding: .6rem .7rem; resize: vertical; min-height: 70px; line-height: 1.45; }
    input:focus, textarea:focus { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,.08); background: #fff; }
    input.err, textarea.err { border-color: #c00 !important; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; }
    /* FIX: Datumsfeld iPad – linksbündig, begrenzte Breite */
    input[type="date"] { text-align: left; max-width: 180px; -webkit-appearance: none; }
    .km-wrap { position: relative; }
    .km-suffix { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); font-size: .88rem; color: #888; pointer-events: none; }
    .hint-s { font-size: .75rem; color: #888; margin-top: .3rem; }
    .hint-c { font-size: .75rem; color: #1558b0; margin-top: .25rem; display: none; }
    .betrag-box { background: #f0f7ff; border: 1.5px solid #b3d4f0; border-radius: 5px; height: 2.5rem; display: flex; align-items: center; padding: 0 .75rem; font-size: 1.05rem; font-weight: 700; color: #1558b0; }
    .betrag-note { font-size: .74rem; color: #888; margin-top: .28rem; }
    .consent-block { background: #f7f7f7; border: 1px solid #ddd; border-radius: 6px; padding: .9rem 1rem; margin-bottom: 1.2rem; }
    .consent-row { display: flex; align-items: flex-start; gap: .6rem; margin-top: .4rem; }
    .consent-row input[type="checkbox"] { width: 1rem; height: 1rem; flex-shrink: 0; margin-top: .18rem; accent-color: #111; }
    .consent-row label { font-size: .88rem; cursor: pointer; color: #222; line-height: 1.5; }
    #submitBtn { width: 100%; padding: .82rem; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem; transition: background .15s; }
    #submitBtn:hover { background: #333; }
    #submitBtn:disabled { background: #aaa; cursor: not-allowed; }
    .spin { width: 17px; height: 17px; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; display: none; }
    @keyframes rot { to { transform: rotate(360deg); } }
    #msg { display: none; margin-top: 1rem; padding: .85rem 1rem; border-radius: 6px; font-size: .88rem; line-height: 1.5; }
    #msg.err { background: #fff0f0; border: 1px solid #f5c6c6; color: #9b1c1c; }
    #msg.ok  { background: #f0fff4; border: 1px solid #a7f3c1; color: #1a6e38; }
    #successScreen { display: none; text-align: center; padding: 2rem 1rem; }
    #successScreen .ico { font-size: 3rem; margin-bottom: 1rem; }
    #successScreen h2 { font-size: 1.2rem; margin-bottom: .7rem; }
    #successScreen p  { font-size: .9rem; color: #444; line-height: 1.6; }
    @media (max-width: 520px) { .card { padding: 1.3rem 1rem; } .row { flex-direction: column; gap: 0; } }
  </style>
</head>
<body>
<div class="card">
  <h1>Antrag Erstattung Fahrtkosten</h1>
  <p class="subtitle">BC Erfurt e.V.</p>
  <hr class="divider">

  <div id="formWrap">
    <fieldset>
      <legend>Reisedaten</legend>
      <div class="row">
        <div class="fg">
          <label for="reiseDatum">Reisedatum <span class="req">*</span></label>
          <input type="date" id="reiseDatum">
        </div>
        <div class="fg">
          <label for="mitreisende">Anzahl Mitreisende <span class="req">*</span></label>
          <input type="number" id="mitreisende" min="1" max="20" step="1" placeholder="z.B. 2">
        </div>
      </div>
      <div class="row">
        <div class="fg">
          <label for="startort">Startort <span class="req">*</span></label>
          <input type="text" id="startort" value="Erfurt" placeholder="z.B. Erfurt">
        </div>
        <div class="fg">
          <label for="zielort">Zielort <span class="req">*</span></label>
          <input type="text" id="zielort" placeholder="z.B. Berlin">
        </div>
      </div>
      <div class="fg">
        <label for="anlass">Anlass der Reise / Spiel <span class="req">*</span></label>
        <textarea id="anlass" placeholder="z.B. Spielnr. 12345 · BC Erfurt vs. SV Musterstadt"></textarea>
      </div>
      <div class="fg">
        <label for="kilometer">Gefahrene Kilometer (Hin + Rück) <span class="req">*</span></label>
        <div class="km-wrap">
          <input type="number" id="kilometer" min="1" step="1"
                 placeholder="akt. Vergütung 0,15 € pro km" style="padding-right:2.6rem">
          <span class="km-suffix">km</span>
        </div>
        <div class="hint-s">Hin + Rück zusammen · Vergütung: 0,15 € / km</div>
        <div class="hint-c" id="kmCalcHint"></div>
      </div>
      <div class="fg">
        <label>Auszahlungsbetrag</label>
        <div class="betrag-box" id="betragBox">– €</div>
        <div class="betrag-note">Wird automatisch berechnet (km × 0,15 €)</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Persönliche Daten</legend>
      <div class="row">
        <div class="fg">
          <label for="vorname">Vorname <span class="req">*</span></label>
          <input type="text" id="vorname" autocomplete="given-name">
        </div>
        <div class="fg">
          <label for="nachname">Nachname <span class="req">*</span></label>
          <input type="text" id="nachname" autocomplete="family-name">
        </div>
      </div>
      <div class="fg">
        <label for="email">E-Mail <span class="req">*</span></label>
        <input type="email" id="email" autocomplete="email" inputmode="email">
      </div>
      <div class="fg">
        <label for="kontoinhaber">Kontoinhaber <span class="req">*</span></label>
        <input type="text" id="kontoinhaber" autocomplete="name">
      </div>
      <div class="fg">
        <label for="iban">IBAN <span class="req">*</span></label>
        <input type="text" id="iban" placeholder="DE00 0000 0000 0000 0000 00"
               maxlength="27" autocomplete="off" spellcheck="false">
      </div>
    </fieldset>

    <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden">
      <label for="faxNummer">Fax</label>
      <input type="text" id="faxNummer" tabindex="-1" autocomplete="off">
    </div>

    <div class="consent-block">
      <div class="consent-row">
        <input type="checkbox" id="bestaetigung">
        <label for="bestaetigung">Hiermit bestätige ich, dass die Angaben korrekt und vollständig sind.</label>
      </div>
    </div>

    <button type="button" id="submitBtn">
      <span id="btnTxt">Antrag absenden</span>
      <span class="spin" id="spin"></span>
    </button>
    <div id="msg"></div>
  </div>

  <div id="successScreen">
    <div class="ico">✅</div>
    <h2 id="okName"></h2>
    <p>Dein Antrag auf Erstattung der Fahrtkosten wurde erfolgreich übermittelt.<br>
       Wir melden uns in Kürze per E-Mail bei dir.</p>
  </div>
</div>

<script>
(function() {
"use strict";

var _pageLoadTs = Date.now();

var PROXY   = "https://script.google.com/macros/s/AKfycbzXYobUIQuU47SRntyeRXL32LBJW-DtZA4dsOeYLXOSfP6x6E5g2nm0REQhcRKy3zjM/exec";
var RATE    = 0.15;
var TIMEOUT = 90000;

var kmServer    = null;
var kmServerTyp = "Referenz";
var kmThreshold = 10;
var kmWarnDone  = false;
var kinhTouched = false;
var kmPending   = false;
var lastStartort = "";
var lastZielort  = "";

function gi(id) { return document.getElementById(id); }

function obfuscateTs(ts) {
  var s = String(ts);
  var out = "";
  for (var i = 0; i < s.length; i++) {
    out += String.fromCharCode(s.charCodeAt(i) ^ 42);
  }
  return btoa(out);
}

var fReiseDatum   = gi("reiseDatum");
var fStartort     = gi("startort");
var fZielort      = gi("zielort");
var fAnlass       = gi("anlass");
var fMitreisende  = gi("mitreisende");
var fKilometer    = gi("kilometer");
var fVorname      = gi("vorname");
var fNachname     = gi("nachname");
var fEmail        = gi("email");
var fKontoinhaber = gi("kontoinhaber");
var fIban         = gi("iban");
var fCheckbox     = gi("bestaetigung");
var boxBetrag     = gi("betragBox");
var hintKm        = gi("kmCalcHint");
var btnSubmit     = gi("submitBtn");
var elMsg         = gi("msg");

/* ---------- BETRAG ---------- */
function berechneBetrag() {
  var km = parseFloat(fKilometer.value);
  boxBetrag.textContent = km > 0
    ? (km * RATE).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " \u20ac"
    : "\u2013 \u20ac";
  kmWarnDone = false;
}
["input","change","keyup"].forEach(function(ev) { fKilometer.addEventListener(ev, berechneBetrag); });

/* ---------- IBAN-Formatierung ---------- */
fIban.addEventListener("input", function() {
  var raw = fIban.value.replace(/\s/g, "").toUpperCase();
  fIban.value = (raw.match(/.{1,4}/g) || []).join(" ");
});

/* ---------- KONTOINHABER Auto-Sync ---------- */
function syncKinh() {
  if (kinhTouched) return;
  var full = (fVorname.value.trim() + " " + fNachname.value.trim()).trim();
  if (full) fKontoinhaber.value = full;
}
fKontoinhaber.addEventListener("input", function() {
  var auto = (fVorname.value.trim() + " " + fNachname.value.trim()).trim();
  kinhTouched = fKontoinhaber.value.trim() !== auto;
});
["input","change","blur"].forEach(function(ev) {
  fVorname.addEventListener(ev,  syncKinh);
  fNachname.addEventListener(ev, syncKinh);
});

/* ---------- KM VOM SERVER ---------- */
function holeKm() {
  if (kmPending) return;
  var s = fStartort.value.trim();
  var z = fZielort.value.trim();
  if (!s || !z) return;
  if (s === lastStartort && z === lastZielort && kmServer !== null) return;
  kmPending = true;
  hintKm.textContent   = "\uD83D\uDCCD Berechne Entfernung \u2026";
  hintKm.style.display = "block";

  fetch(PROXY, {
    method:  "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body:    JSON.stringify({ action: "checkKm", startort: s, zielort: z, kmUser: parseFloat(fKilometer.value) || 0 })
  })
  .then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(j) {
    kmPending = false;
    if (j && j.success && j.kmCalc) {
      kmServer    = j.kmCalc;
      kmServerTyp = j.kmTyp  || "Referenz";
      kmThreshold = j.schwellePct || 10;
      lastStartort = s;
      lastZielort  = z;
      hintKm.textContent   = "\uD83D\uDCCD " + kmServerTyp + " " + s + " \u2192 " + z
                             + ": ca. " + j.kmCalc + " km (Hin + R\u00fcck)";
      hintKm.style.display = "block";
      fKilometer.value = j.kmCalc;
      berechneBetrag();
    } else {
      hintKm.style.display = "none";
    }
  })
  .catch(function() {
    kmPending            = false;
    hintKm.style.display = "none";
  });
}

// Event listeners on both Startort and Zielort
fStartort.addEventListener("blur", function() {
  var s = fStartort.value.trim();
  var z = fZielort.value.trim();
  if (s && z) { holeKm(); }
});
fStartort.addEventListener("input", function() {
  kmServer = null;
  lastStartort = "";
  lastZielort = "";
  hintKm.style.display = "none";
});

fZielort.addEventListener("blur", function() {
  var s = fStartort.value.trim();
  var z = fZielort.value.trim();
  if (s && z) { holeKm(); }
});
fZielort.addEventListener("input", function() {
  kmServer = null;
  lastStartort = "";
  lastZielort = "";
  hintKm.style.display = "none";
});

/* ---------- VALIDIERUNG ---------- */
function validate() {
  var felder = [fReiseDatum, fStartort, fZielort, fAnlass, fMitreisende, fKilometer,
                fVorname, fNachname, fEmail, fKontoinhaber, fIban];
  var ok = true;
  felder.forEach(function(el) {
    if (!el.value.trim()) { el.classList.add("err"); ok = false; }
    else                   { el.classList.remove("err"); }
  });

  if (fReiseDatum.value) {
    var parts = fReiseDatum.value.split("-");
    var dat   = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    var heute = new Date(); heute.setHours(0, 0, 0, 0);
    var diff  = Math.floor((heute - dat) / 86400000);
    if (dat.getFullYear() !== heute.getFullYear()) {
      fReiseDatum.classList.add("err");
      zeigeMsg("Anträge nur für Reisen im laufenden Kalenderjahr möglich.", "err");
      return false;
    }
    if (diff > 30) {
      fReiseDatum.classList.add("err");
      zeigeMsg("Anträge nur bis zu 30 Tage nach der Reise möglich.", "err");
      return false;
    }
    if (diff < 0) {
      fReiseDatum.classList.add("err");
      zeigeMsg("Das Reisedatum darf nicht in der Zukunft liegen.", "err");
      return false;
    }
  }

  if (!(parseFloat(fKilometer.value) > 0)) { fKilometer.classList.add("err"); ok = false; }

  if (!fCheckbox.checked) { fCheckbox.style.outline = "2px solid #c00"; ok = false; }
  else                     { fCheckbox.style.outline = ""; }

  return ok;
}

function zeigeMsg(txt, cls) {
  elMsg.textContent   = txt;
  elMsg.className     = cls;
  elMsg.style.display = "block";
  elMsg.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function setBusy(b) {
  btnSubmit.disabled       = b;
  gi("btnTxt").textContent = b ? "Wird gesendet \u2026" : "Antrag absenden";
  gi("spin").style.display = b ? "inline-block" : "none";
}

/* ---------- SUBMIT ---------- */
btnSubmit.addEventListener("click", function() {
  elMsg.style.display = "none";
  if (!validate()) {
    if (elMsg.style.display === "none" || !elMsg.style.display) {
      zeigeMsg("Bitte alle Pflichtfelder ausfüllen.", "err");
    }
    return;
  }

  var km = parseFloat(fKilometer.value);

  if (kmServer !== null && !kmWarnDone) {
    var abw = (km - kmServer) / kmServer;
    if (abw > kmThreshold / 100) {
      kmWarnDone = true;
      if (!confirm(
        "Kilometerangabe\n\n"
        + "Angegeben: " + km + " km\n"
        + kmServerTyp + " " + fStartort.value.trim() + " \u2192 " + fZielort.value.trim()
        + " (Hin + R\u00fcck): ca. " + kmServer + " km\n"
        + "Abweichung: " + Math.round(abw * 100) + "% (Schwelle: " + kmThreshold + "%)\n\n"
        + "Trotzdem absenden?"
      )) return;
    }
  }

  setBusy(true);

  var payload = {
    reiseDatum:   fReiseDatum.value,
    startort:     fStartort.value.trim(),
    zielort:      fZielort.value.trim(),
    anlass:       fAnlass.value.trim(),
    mitreisende:  parseInt(fMitreisende.value, 10),
    kilometer:    km,
    betrag:       Math.round(km * RATE * 100) / 100,
    vorname:      fVorname.value.trim(),
    nachname:     fNachname.value.trim(),
    email:        fEmail.value.trim(),
    kontoinhaber: fKontoinhaber.value.trim(),
    iban:         fIban.value.replace(/\s/g, "").toUpperCase(),
    faxNummer:    gi("faxNummer").value,
    _ts:          btoa(String(_pageLoadTs)),
    _tok:         obfuscateTs(_pageLoadTs)
  };

  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var tid  = setTimeout(function() { if (ctrl) ctrl.abort(); }, TIMEOUT);
  var opts = {
    method:  "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body:    JSON.stringify(payload)
  };
  if (ctrl) opts.signal = ctrl.signal;

  fetch(PROXY, opts)
    .then(function(r) { clearTimeout(tid); return r.json(); })
    .then(function(j) {
      setBusy(false);
      if (j && j.success) {
        gi("formWrap").style.display      = "none";
        gi("successScreen").style.display = "block";
        gi("okName").textContent          = "Danke, " + payload.vorname + "!";
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        zeigeMsg("Fehler: " + (j && j.error ? j.error : "Unbekannter Fehler."), "err");
      }
    })
    .catch(function(e) {
      clearTimeout(tid);
      setBusy(false);
      zeigeMsg("Fehler: " + (e.name === "AbortError" ? "Zeitüberschreitung." : "Netzwerkfehler: " + e.message), "err");
    });
});

})();
</script>
</body>
</html>
